# Dovecot 2.4 store behind the Gmail stand-in (gmail_proxy.py); internal user testenv.
# Loopback only inside the container (port 1143); clients reach it only through the proxy.
# Users (password "pass"): gmail, gmailhidden, gmailcapped, gmailcap5k (seed.py).
dovecot_config_version = 2.4.5
dovecot_storage_version = 2.4.5

base_dir = /tmp/dovecot/run
state_dir = /tmp/dovecot/state
log_path = /tmp/dovecot/dovecot.log
info_log_path = /tmp/dovecot/dovecot.log

protocols {
  imap = yes
}
listen = 127.0.0.1

default_internal_user = testenv
default_internal_group = testenv
default_login_user = testenv

ssl = no
auth_allow_cleartext = yes
auth_mechanisms = plain login

passdb static {
  password = pass
}
userdb static {
  fields {
    home = /mailstore/%{user}
  }
}

mail_uid = testenv
mail_gid = testenv
mail_driver = mdbox
mail_path = ~/mail
mail_fsync = never
mail_max_userip_connections = 100

namespace inbox {
  inbox = yes
  separator = /
  mailbox "[Gmail]/All Mail" {
    special_use = \All
  }
  mailbox "[Gmail]/Sent Mail" {
    special_use = \Sent
  }
  mailbox "[Gmail]/Important" {
    special_use = \Important
  }
  mailbox "[Gmail]/Spam" {
    special_use = \Junk
  }
  mailbox "[Gmail]/Trash" {
    special_use = \Trash
  }
}

service imap-login {
  chroot =
  inet_listener imap {
    port = 1143
  }
  inet_listener imaps {
    port = 0
  }
}
service imap {
  process_limit = 64
  vsz_limit = 2G
}
service anvil {
  chroot =
}
service auth {
  user = testenv
}
service auth-worker {
  user = testenv
}
