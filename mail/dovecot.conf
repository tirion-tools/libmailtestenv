dovecot_config_version = 2.4.5
dovecot_storage_version = 2.4.5
protocols = imap lmtp
listen = *
log_path = /var/log/dovecot.log
auth_verbose = yes
auth_mechanisms = plain login xoauth2 oauthbearer
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
mail_driver = maildir
mail_path = ~/Maildir

# TLS everywhere; cleartext AUTH is refused before STARTTLS.
ssl = required
# Default certificate (no SNI / unknown name): valid chain, wrong name.
ssl_server_cert_file = /etc/dovecot/pki/wrong.crt
ssl_server_key_file = /etc/dovecot/pki/wrong.key
# The right certificate is only served when the client sends SNI = mail.mailtestenv.test, so a
# successful validation proves MailKit used the host name for SNI.
local_name mail.mailtestenv.test {
  ssl_server_cert_file = /etc/dovecot/pki/mail.crt
  ssl_server_key_file = /etc/dovecot/pki/mail.key
}
local_name dns-a.mailtestenv.test {
  ssl_server_cert_file = /etc/dovecot/pki/mail.crt
  ssl_server_key_file = /etc/dovecot/pki/mail.key
}
# Right name, untrusted issuer.
local_name rogue.mailtestenv.test {
  ssl_server_cert_file = /etc/dovecot/pki/rogue.crt
  ssl_server_key_file = /etc/dovecot/pki/rogue.key
}

passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}
userdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}

# XOAUTH2 / OAUTHBEARER: JWTs validated locally (RS256 signature, exp/nbf/iat, iss) against the
# key in /etc/dovecot/oauth2-keys/default/RS256/default. No introspection server.
oauth2 {
  introspection_mode = local
  username_attribute = sub
  issuers = https://issuer.mailtestenv.test
  oauth2_local_validation {
    dict fs {
      fs posix {
        prefix = /etc/dovecot/oauth2-keys/
      }
    }
  }
}

# The special-use mailboxes a real provider has from the first login (RFC 6154 SPECIAL-USE in LIST), created and
# subscribed at login, so a fresh instance has Sent, Drafts, Trash and Junk without a client creating them.
namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
}

service imap-login {
  inet_listener imap {
    listen = *
    port = 143
  }
  inet_listener imaps {
    listen = *
    port = 993
    ssl = yes
  }
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
