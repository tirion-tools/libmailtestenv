# Dovecot 2.4 serving the Enron corpus (testenv enron role), from the gmail role's configuration:
# maildir per user, passwd-file of the converted mailbox owners, IMAP on 13143 (plain or STARTTLS) and IMAPS on
# 13993 inside the container, SASL for Postfix submission (587 STARTTLS, 465 TLS; enron/main.cf); the host
# publishes all four on 127.0.0.1 only. TLS uses the mail role's CA (certificate for
# enron.mailtestenv.test and mail.mailtestenv.test, from /tls = testenv/.state/mail/private). Cleartext auth stays allowed
# on 13143 without STARTTLS: test data on loopback.
# Users: one per Enron mailbox owner (convert.py writes /state/pristine/users), password "pass".
dovecot_config_version = 2.4.5
dovecot_storage_version = 2.4.5

base_dir = /tmp/dovecot/run
state_dir = /tmp/dovecot/state
log_path = /tmp/dovecot/dovecot.log
info_log_path = /tmp/dovecot/dovecot.log

protocols {
  imap = yes
}
listen = *

default_internal_user = testenv
default_internal_group = testenv
default_login_user = testenv

ssl = yes
ssl_server_cert_file = /tls/enron.crt
ssl_server_key_file = /tls/enron.key
auth_allow_cleartext = yes
auth_mechanisms = plain login

passdb passwd-file {
  passwd_file_path = /state/pristine/users
}
userdb static {
  fields {
    home = /state/work/mail/%{user}
  }
}

mail_uid = testenv
mail_gid = testenv
mail_driver = maildir
mail_path = ~/Maildir
mail_fsync = never
mail_max_userip_connections = 100

namespace inbox {
  inbox = yes
  separator = /

}

service imap-login {
  chroot =
  inet_listener imap {
    port = 13143
  }
  inet_listener imaps {
    port = 13993
    ssl = yes
  }
}
service imap {
  process_limit = 64
  vsz_limit = 2G
}
service anvil {
  chroot =
}
service auth {
  user = testenv
  # SASL for the Postfix submission service (enron/main.cf).
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
service auth-worker {
  user = testenv
}
