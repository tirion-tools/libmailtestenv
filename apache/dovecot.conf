# Dovecot 2.4 serving the ASF list dataset (testenv apache role), from the gmail role's configuration:
# one maildir user (fs layout, as datasets/apache/build.py writes it), IMAP on 14143 inside the container.
# The host publishes it on 127.0.0.1:14143 only. Cleartext auth: test data on loopback.
# One user, `apache`, password "pass" (users file next to this configuration).
dovecot_config_version = 2.4.5
dovecot_storage_version = 2.4.5

base_dir = /tmp/dovecot/run
state_dir = /tmp/dovecot/state
log_path = /tmp/dovecot/dovecot.log
info_log_path = /tmp/dovecot/dovecot.log

protocols {
  imap = yes
}
listen = *

default_internal_user = testenv
default_internal_group = testenv
default_login_user = testenv

ssl = no
auth_allow_cleartext = yes
auth_mechanisms = plain login

passdb passwd-file {
  passwd_file_path = /opt/testenv/apache/users
}
userdb static {
  fields {
    home = /state/work
  }
}

# uid/gid 1000 own the hard-linked dataset tree (apache/role.env); indexes stay outside it.
mail_uid = 1000
mail_gid = 1000
mail_driver = maildir
mail_path = ~/mail
mail_index_path = ~/index
mailbox_list_layout = fs
mail_fsync = never
mail_max_userip_connections = 100

namespace inbox {
  inbox = yes
  separator = /

}

service imap-login {
  chroot =
  inet_listener imap {
    port = 14143
  }
  inet_listener imaps {
    port = 0
  }
}
service imap {
  process_limit = 64
  vsz_limit = 2G
}
service anvil {
  chroot =
}
service auth {
  user = testenv
}
service auth-worker {
  user = testenv
}
